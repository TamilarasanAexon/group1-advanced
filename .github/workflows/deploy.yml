name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy, for example v1.0.0 or latest"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: acme-ims-dev

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Show deployment configuration
      # --------------------------------------------------------
      - name: Show deployment configuration
        run: |
          echo "Environment: dev"
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "Version: ${{ inputs.version }}"
          echo "Full image:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}"

      # --------------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Pull released image
      # --------------------------------------------------------
      - name: Pull release image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}"

          echo "Pulling image:"
          echo "$IMAGE"

          docker pull "$IMAGE"

      # --------------------------------------------------------
      # Verify image exists
      # --------------------------------------------------------
      - name: Verify release image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}"

          docker image inspect "$IMAGE"

          echo "Available Docker images:"
          docker images

      # --------------------------------------------------------
      # Remove previous container if present
      # --------------------------------------------------------
      - name: Remove existing dev container
        run: |
          docker rm -f "${{ env.CONTAINER_NAME }}" 2>/dev/null || true

      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------
      - name: Deploy container
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}"

          docker run -d \
            --name "${{ env.CONTAINER_NAME }}" \
            -p 8080:8080 \
            "$IMAGE"

      # --------------------------------------------------------
      # Show container status
      # --------------------------------------------------------
      - name: Verify container started
        run: |
          docker ps -a

          if ! docker ps \
            --format '{{.Names}}' \
            | grep -q "^${{ env.CONTAINER_NAME }}$"; then

            echo "Container failed to start."
            docker logs "${{ env.CONTAINER_NAME }}" || true
            exit 1
          fi

          echo "Container started successfully"

      # --------------------------------------------------------
      # Health check
      # --------------------------------------------------------
      - name: Wait for application health
        run: |
          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8080/health > /dev/null; then

              echo "Dev application is healthy"
              exit 0

            fi

            echo "Waiting for dev application..."
            sleep 2

          done

          echo "Dev deployment health check failed"

          echo "------ CONTAINER STATUS ------"
          docker ps -a || true

          echo "------ CONTAINER LOG ------"
          docker logs "${{ env.CONTAINER_NAME }}" || true

          exit 1

      # --------------------------------------------------------
      # API verification
      # --------------------------------------------------------
      - name: Verify root endpoint
        run: |
          curl \
            --fail \
            http://127.0.0.1:8080/

      - name: Verify health endpoint
        run: |
          curl \
            --fail \
            http://127.0.0.1:8080/health

      - name: Verify documentation endpoint
        run: |
          curl \
            --fail \
            http://127.0.0.1:8080/doc

      # --------------------------------------------------------
      # Deployment information
      # --------------------------------------------------------
      - name: Show deployment information
        run: |
          echo "Running containers:"
          docker ps

          echo ""
          echo "Deployed image:"
          docker inspect \
            --format='{{.Config.Image}}' \
            "${{ env.CONTAINER_NAME }}"

      # --------------------------------------------------------
      # GitHub deployment summary
      # --------------------------------------------------------
      - name: Deployment summary
        run: |
          echo "## Dev Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Environment: dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Health endpoint: PASSED" >> "$GITHUB_STEP_SUMMARY"
          echo "Root endpoint: PASSED" >> "$GITHUB_STEP_SUMMARY"
          echo "Documentation endpoint: PASSED" >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------------
      # Troubleshooting information
      # --------------------------------------------------------
      - name: Show logs on failure
        if: failure()
        run: |
          echo "------ DOCKER IMAGES ------"
          docker images || true

          echo "------ CONTAINER STATUS ------"
          docker ps -a || true

          echo "------ CONTAINER LOG ------"
          docker logs "${{ env.CONTAINER_NAME }}" || true

      # --------------------------------------------------------
      # GitHub runners are temporary, so clean up test deployment
      # --------------------------------------------------------
      - name: Clean up dev container
        if: always()
        run: |
          docker rm -f "${{ env.CONTAINER_NAME }}" || true