name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: acme-ims
  IMAGE_TAG: ci

jobs:

  # =========================================================
  # 1. PYTHON API TESTS
  # =========================================================
  python-tests:
    name: Python API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Display Python information
        run: |
          python --version
          python -m pip --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install application and test dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            echo "Installing requirements-dev.txt"
            python -m pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            echo "Installing requirements.txt"
            python -m pip install -r requirements.txt
            python -m pip install pytest httpx2
          else
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

      - name: Verify test dependencies
        run: |
          python -m pip show fastapi
          python -m pip show uvicorn
          python -m pip show pytest
          python -m pip show httpx2

      - name: Verify application import
        run: |
          python -c "from app.main import app; print('app.main import successful')"

      - name: Run Python tests
        run: |
          python -m pytest -v


  # =========================================================
  # 2. TERRAFORM VALIDATION
  # =========================================================
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify infrastructure directory
        run: |
          if [ ! -d infrastructure ]; then
            echo "ERROR: infrastructure directory not found"
            exit 1
          fi

          find infrastructure \
            -maxdepth 3 \
            -type f \
            -name "*.tf" \
            -print

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Display Terraform version
        run: |
          terraform version

      - name: Terraform format check
        run: |
          terraform -chdir=infrastructure fmt -check -recursive

      - name: Terraform initialize
        run: |
          terraform -chdir=infrastructure init \
            -backend=false \
            -input=false

      - name: Terraform validate
        run: |
          terraform -chdir=infrastructure validate \
            -no-color


  # =========================================================
  # 3. REPOSITORY SECURITY CHECKS
  # =========================================================
  security-checks:
    name: Repository Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify infrastructure directory
        run: |
          if [ ! -d infrastructure ]; then
            echo "ERROR: infrastructure directory not found"
            exit 1
          fi

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          framework: terraform
          output_format: cli
          quiet: true
          soft_fail: false


  # =========================================================
  # 4. DOCKER BUILD, API VALIDATION AND TRIVY
  # =========================================================
  container-security:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest

    needs:
      - python-tests
      - terraform-validation
      - security-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display repository structure
        run: |
          pwd
          ls -la

          echo "Dockerfiles found:"
          find . \
            -maxdepth 3 \
            -type f \
            -name Dockerfile \
            -print

      - name: Verify required Docker files
        run: |
          if [ ! -f app/Dockerfile ]; then
            echo "ERROR: app/Dockerfile not found"
            exit 1
          fi

          if [ ! -f app/main.py ]; then
            echo "ERROR: app/main.py not found"
            exit 1
          fi

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Display Docker version
        run: |
          docker --version
          docker buildx version

      - name: Pull current Python base image
        run: |
          docker pull "python:${PYTHON_VERSION}-slim"

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --no-cache \
            --file app/Dockerfile \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      - name: Verify Docker image
        run: |
          docker image inspect \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            > /dev/null

          echo "Docker image ${IMAGE_NAME}:${IMAGE_TAG} created successfully"

      - name: Verify patched package versions
        run: |
          docker run --rm \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            python -c "import importlib.metadata as m; \
            print('msgpack:', m.version('msgpack')); \
            print('setuptools:', m.version('setuptools')); \
            print('urllib3:', m.version('urllib3'))"

      - name: Start API container
        run: |
          docker run \
            --detach \
            --name acme-ims-ci \
            --publish 8080:8080 \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Wait for API health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8080/health; then
              echo
              echo "API health check passed"
              exit 0
            fi

            echo "Waiting for API: attempt ${attempt}/30"
            sleep 2
          done

          echo "ERROR: API health check failed"
          docker logs acme-ims-ci
          exit 1

      - name: Validate API endpoints
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/

          echo

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/health

          echo

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/openapi.json \
            > /dev/null

          echo "API endpoint validation passed"

      - name: Show container logs
        if: always()
        run: |
          docker logs acme-ims-ci || true

      - name: Stop API container
        if: always()
        run: |
          docker rm --force acme-ims-ci || true

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          version: "v0.74.0"
          scan-type: "image"
          image-ref: "acme-ims:ci"
          scanners: "vuln"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          skip-files: "**/pip/_vendor/bom.cdx.json"

      - name: CI completed successfully
        run: |
          echo "========================================="
          echo "CI PIPELINE COMPLETED SUCCESSFULLY"
          echo "========================================="
          echo "Python tests          : PASSED"
          echo "Terraform validation  : PASSED"
          echo "Gitleaks scan         : PASSED"
          echo "Checkov scan          : PASSED"
          echo "Docker build          : PASSED"
          echo "Container health      : PASSED"
          echo "API endpoint checks   : PASSED"
          echo "Trivy security scan   : PASSED"
          echo "========================================="