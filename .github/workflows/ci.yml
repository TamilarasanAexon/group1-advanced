name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: acme-ims
  IMAGE_TAG: ci
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.9.8"
  TRIVY_DISABLE_VEX_NOTICE: "true"

jobs:

  # =========================================================
  # 1. PYTHON API TESTS
  # =========================================================
  python-tests:
    name: Python API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Display Python information
        run: |
          python --version
          python -m pip --version

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade \
            pip \
            "setuptools>=78.1.1"

      - name: Install test dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            echo "Installing requirements-dev.txt"
            python -m pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            echo "requirements-dev.txt not found"
            echo "Installing requirements.txt and test dependencies"
            python -m pip install -r requirements.txt
            python -m pip install pytest httpx2
          else
            echo "ERROR: No requirements file found"
            exit 1
          fi

      - name: Verify required packages
        run: |
          python -m pip show fastapi
          python -m pip show uvicorn
          python -m pip show pytest
          python -m pip show httpx2

      - name: Verify application import
        run: |
          python -c "from app.main import app; print('app.main import successful')"

      - name: Run pytest
        run: |
          python -m pytest -v


  # =========================================================
  # 2. TERRAFORM VALIDATION
  # =========================================================
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify infrastructure directory
        run: |
          if [ ! -d infrastructure ]; then
            echo "ERROR: infrastructure directory not found"
            exit 1
          fi

          find infrastructure \
            -maxdepth 3 \
            -type f \
            -name "*.tf" \
            -print

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Display Terraform version
        run: |
          terraform version

      - name: Terraform format check
        run: |
          terraform -chdir=infrastructure fmt -check -recursive

      - name: Terraform initialize
        run: |
          terraform -chdir=infrastructure init \
            -backend=false \
            -input=false

      - name: Terraform validate
        run: |
          terraform -chdir=infrastructure validate \
            -no-color


  # =========================================================
  # 3. GITLEAKS SECRET SCAN
  # =========================================================
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =========================================================
  # 4. CHECKOV INFRASTRUCTURE SCAN
  # =========================================================
  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Terraform files
        run: |
          if [ ! -d infrastructure ]; then
            echo "ERROR: infrastructure directory not found"
            exit 1
          fi

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          framework: terraform
          output_format: cli
          quiet: true
          soft_fail: false


  # =========================================================
  # 5. DOCKER BUILD, HEALTH CHECK AND TRIVY SCAN
  # =========================================================
  container-security:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest

    needs:
      - python-tests
      - terraform-validation
      - secret-scan
      - checkov

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display repository structure
        run: |
          pwd
          ls -la
          echo "Dockerfiles:"
          find . -maxdepth 3 -type f -name Dockerfile -print

      - name: Verify required container files
        run: |
          if [ ! -f app/Dockerfile ]; then
            echo "ERROR: app/Dockerfile not found"
            exit 1
          fi

          if [ ! -f requirements.txt ]; then
            echo "ERROR: root requirements.txt not found"
            exit 1
          fi

          if [ ! -f app/main.py ]; then
            echo "ERROR: app/main.py not found"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Display Docker information
        run: |
          docker --version
          docker buildx version

      - name: Pull current Python base image
        run: |
          docker pull python:${{ env.PYTHON_VERSION }}-slim

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --no-cache \
            --file app/Dockerfile \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      - name: Verify Docker image
        run: |
          docker image inspect \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            > /dev/null

          echo "Docker image ${IMAGE_NAME}:${IMAGE_TAG} created"

      - name: Display installed security package versions
        run: |
          docker run --rm \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            python -c \
            "import importlib.metadata as m; \
            packages=['pip','setuptools','urllib3','msgpack']; \
            [print(f'{p}: {m.version(p)}') \
            if m.packages_distributions().get(p) \
            else print(f'{p}: not installed') \
            for p in packages]"

      - name: Start API container
        run: |
          docker run \
            --detach \
            --name acme-ims-ci \
            --publish 8080:8080 \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Wait for API health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8080/health; then
              echo
              echo "API health check passed"
              exit 0
            fi

            echo "Waiting for API: attempt ${attempt}/30"
            sleep 2
          done

          echo "ERROR: API health check failed"
          docker logs acme-ims-ci
          exit 1

      - name: Validate API endpoints
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:8080/

          echo

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/health

          echo

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/openapi.json \
            > /dev/null

          echo "Root, health and OpenAPI endpoints passed"

      - name: Stop API container
        if: always()
        run: |
          docker rm --force acme-ims-ci || true

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          scanners: vuln
          vuln-type: "os,library"
          format: table
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          skip-version-check: true

      - name: CI completed successfully
        run: |
          echo "========================================="
          echo "CI PIPELINE COMPLETED SUCCESSFULLY"
          echo "========================================="
          echo "Python Tests         : PASSED"
          echo "Terraform Validation : PASSED"
          echo "Gitleaks Scan        : PASSED"
          echo "Checkov Scan         : PASSED"
          echo "Docker Build         : PASSED"
          echo "Container Health     : PASSED"
          echo "Trivy HIGH/CRITICAL  : PASSED"
          echo "========================================="