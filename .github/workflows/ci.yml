name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # ============================================================
  # FastAPI Application Tests
  # ============================================================
  test:
    name: FastAPI Application Tests
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify project files
        run: |
          echo "Repository structure:"
          find app -maxdepth 3 -type f -print

          echo "Checking required files..."
          test -f app/main.py
          test -f app/tests/test_health.py
          test -f requirements.txt

      - name: Display requirements
        run: |
          echo "------ requirements.txt ------"
          cat requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          # Explicitly install the dependency required by the
          # current Starlette TestClient implementation.
          python -m pip install httpx2

      - name: Verify installed dependencies
        run: |
          python --version
          python -m pip show fastapi
          python -m pip show starlette
          python -m pip show uvicorn
          python -m pip show pytest
          python -m pip show httpx2

      - name: Validate Python syntax
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/tests/test_health.py

      - name: Validate FastAPI import
        run: |
          python -c "from app.main import app; print('FastAPI app import successful:', app.title)"

      - name: Run pytest
        run: |
          python -m pytest -q

      - name: Start FastAPI application
        run: |
          python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8080 \
            > api.log 2>&1 &

          echo $! > api.pid

      - name: Wait for FastAPI application
        run: |
          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8080/health > /dev/null; then

              echo "FastAPI application is ready"
              exit 0
            fi

            echo "Waiting for FastAPI application..."
            sleep 1
          done

          echo "FastAPI application failed to start"

          echo "------ FastAPI log ------"
          cat api.log || true

          exit 1

      - name: Validate health endpoint
        run: |
          RESPONSE=$(curl \
            --fail \
            --silent \
            http://127.0.0.1:8080/health)

          echo "Health response: $RESPONSE"

          echo "$RESPONSE" | grep -q '"status":"ok"'

      - name: Validate root endpoint
        run: |
          RESPONSE=$(curl \
            --fail \
            --silent \
            http://127.0.0.1:8080/)

          echo "Root response: $RESPONSE"

          echo "$RESPONSE" \
            | grep -q '"service":"inventory-management-system"'

      - name: Validate Swagger UI
        run: |
          curl \
            --fail \
            --silent \
            http://127.0.0.1:8080/doc \
            --output swagger.html

          grep -qi "swagger" swagger.html
          grep -q "Acme Retail Inventory Management System" \
            swagger.html

          echo "Swagger UI validation passed"

      - name: Validate OpenAPI schema
        run: |
          curl \
            --fail \
            --silent \
            http://127.0.0.1:8080/openapi.json \
            --output openapi.json

          python - <<'PY'
          import json

          with open(
              "openapi.json",
              encoding="utf-8",
          ) as file:
              schema = json.load(file)

          assert (
              schema["info"]["title"]
              == "Acme Retail Inventory Management System"
          )

          assert schema["info"]["version"] == "1.0.0"
          assert "/health" in schema["paths"]
          assert "/products" in schema["paths"]

          print("OpenAPI schema validation passed")
          PY

      - name: Show FastAPI logs on failure
        if: failure()
        run: |
          echo "------ FASTAPI LOG ------"
          cat api.log || true

      - name: Stop FastAPI application
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" || true
          fi


  # ============================================================
  # Terraform Validation
  # ============================================================
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: |
          terraform \
            -chdir=infrastructure \
            fmt \
            -check \
            -recursive

      - name: Terraform initialization
        run: |
          terraform \
            -chdir=infrastructure \
            init \
            -backend=false

      - name: Terraform validation
        run: |
          terraform \
            -chdir=infrastructure \
            validate


  # ============================================================
  # Security Scans
  # ============================================================
  security:
    name: Security Scans
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          framework: terraform
          quiet: true
          compact: true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: "1"


  # ============================================================
  # Docker Build and Container Security
  # ============================================================
  container:
    name: Docker Build and Security Scan
    needs:
      - test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Dockerfile
        run: |
          test -f app/Dockerfile

          echo "------ app/Dockerfile ------"
          cat app/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true
          tags: acme-ims:ci

      - name: Verify Docker image
        run: |
          docker image inspect acme-ims:ci
          docker images

      - name: Start Docker container
        run: |
          docker run -d \
            --name acme-ims-test \
            -p 8080:8080 \
            acme-ims:ci

          docker ps -a

      - name: Wait for container health
        run: |
          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8080/health > /dev/null; then

              echo "Containerized FastAPI application is healthy"
              exit 0
            fi

            echo "Waiting for containerized application..."
            sleep 2
          done

          echo "Container health check failed"

          echo "------ CONTAINER STATUS ------"
          docker ps -a || true

          echo "------ CONTAINER LOG ------"
          docker logs acme-ims-test || true

          exit 1

      - name: Validate container health response
        run: |
          RESPONSE=$(curl \
            --fail \
            --silent \
            http://127.0.0.1:8080/health)

          echo "Container health response: $RESPONSE"

          echo "$RESPONSE" | grep -q '"status":"ok"'

      - name: Validate container Swagger UI
        run: |
          curl \
            --fail \
            --silent \
            http://127.0.0.1:8080/doc \
            --output container-swagger.html

          grep -qi "swagger" container-swagger.html
          grep -q "Acme Retail Inventory Management System" \
            container-swagger.html

          echo "Container Swagger UI validation passed"

      - name: Validate container OpenAPI schema
        run: |
          curl \
            --fail \
            --silent \
            http://127.0.0.1:8080/openapi.json \
            --output container-openapi.json

          python - <<'PY'
          import json

          with open(
              "container-openapi.json",
              encoding="utf-8",
          ) as file:
              schema = json.load(file)

          assert (
              schema["info"]["title"]
              == "Acme Retail Inventory Management System"
          )

          assert "/health" in schema["paths"]
          assert "/products" in schema["paths"]

          print("Container OpenAPI validation passed")
          PY

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "------ DOCKER IMAGES ------"
          docker images || true

          echo "------ CONTAINER STATUS ------"
          docker ps -a || true

          echo "------ CONTAINER LOG ------"
          docker logs acme-ims-test || true

      - name: Stop test container
        if: always()
        run: |
          docker rm -f acme-ims-test || true

      - name: Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acme-ims:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          exit-code: "1"