name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================================================
  # 1. PYTHON TESTS
  # =========================================================
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: |
          python --version
          python -m pip --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            echo "Installing root requirements.txt"
            python -m pip install -r requirements.txt
          elif [ -f app/requirements.txt ]; then
            echo "Installing app/requirements.txt"
            python -m pip install -r app/requirements.txt
          else
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

      # Explicit installation prevents the TestClient failure
      # seen in the GitHub runner.
      - name: Install test dependency
        run: |
          python -m pip install httpx2
          python -m pip show httpx2

      - name: Verify application import
        run: |
          python -c "from app.main import app; print('app.main import successful')"

      - name: Run pytest
        run: |
          python -m pytest -v


  # =========================================================
  # 2. TERRAFORM VALIDATION
  # =========================================================
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform version
        run: |
          terraform version

      - name: Verify infrastructure directory
        run: |
          if [ ! -d infrastructure ]; then
            echo "ERROR: infrastructure directory not found"
            exit 1
          fi

      - name: Terraform Format Check
        run: |
          terraform -chdir=infrastructure fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform -chdir=infrastructure init -backend=false

      - name: Terraform Validate
        run: |
          terraform -chdir=infrastructure validate


  # =========================================================
  # 3. DOCKER BUILD
  # =========================================================
  docker:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest

    needs:
      - test
      - terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          pwd
          ls -la
          echo "Checking Dockerfile locations..."
          find . -maxdepth 2 -name Dockerfile -print

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker version
        run: |
          docker --version

      - name: Build Docker image
        run: |
          if [ -f app/Dockerfile ]; then
            echo "Using app/Dockerfile"
            docker build \
              --file app/Dockerfile \
              --tag acme-ims:ci \
              .
          elif [ -f Dockerfile ]; then
            echo "Using root Dockerfile"
            docker build \
              --file Dockerfile \
              --tag acme-ims:ci \
              .
          else
            echo "ERROR: Dockerfile not found"
            exit 1
          fi

      - name: Verify Docker image
        run: |
          docker image inspect acme-ims:ci > /dev/null
          echo "Docker image acme-ims:ci successfully created"

      - name: Show Docker images
        run: |
          docker images


      # =====================================================
      # 4. TRIVY SECURITY SCAN
      # =====================================================
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "acme-ims:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"


      # =====================================================
      # CI SUCCESS
      # =====================================================
      - name: CI completed successfully
        run: |
          echo "========================================"
          echo "CI PIPELINE COMPLETED SUCCESSFULLY"
          echo "========================================"
          echo "Python Tests       : PASSED"
          echo "Terraform          : PASSED"
          echo "Docker Build       : PASSED"
          echo "Trivy Security Scan: PASSED"
          echo "========================================"