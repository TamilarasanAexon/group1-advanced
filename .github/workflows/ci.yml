name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # Python API Tests
  # ============================================================
  test:
    name: Python API Tests
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f app/requirements.txt ]; then
            pip install -r app/requirements.txt
          fi

          pip install pytest

      - name: Verify project structure
        run: |
          pwd
          ls -la
          ls -la app

      - name: Validate Python syntax
        run: |
          python -m py_compile app/main.py

      - name: Verify Python import
        run: |
          python -c "from app.main import Handler; print('app.main import successful')"

      - name: Start API
        run: |
          python app/main.py > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 1
          done

          echo "API failed to start"
          cat api.log || true
          exit 1

      - name: Run pytest
        run: |
          python -m pytest -q

      - name: Show API log on failure
        if: failure()
        run: |
          echo "------ API LOG ------"
          cat api.log || true

      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) || true
          fi


  # ============================================================
  # Terraform Validation
  # ============================================================
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: |
          terraform -chdir=infrastructure fmt -check -recursive

      - name: Terraform init
        run: |
          terraform -chdir=infrastructure init -backend=false

      - name: Terraform validate
        run: |
          terraform -chdir=infrastructure validate


  # ============================================================
  # Security Scans
  # ============================================================
  security:
    name: Security Scans
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Gitleaks
      # --------------------------------------------------------
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Checkov
      # --------------------------------------------------------
      - name: Checkov Terraform Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          framework: terraform
          quiet: true
          compact: true

      # --------------------------------------------------------
      # Trivy Repository Scan
      # --------------------------------------------------------
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: "1"


  # ============================================================
  # Docker Build + Container Security
  # ============================================================
  container:
    name: Docker Build and Security Scan
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Dockerfile
        run: |
          echo "Checking app/Dockerfile..."
          test -f app/Dockerfile
          ls -la app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # IMPORTANT:
      # load: true loads acme-ims:ci into the runner's Docker daemon.
      # Trivy can then find and scan the image.
      - name: Build and load Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true
          tags: acme-ims:ci

      - name: Verify Docker image
        run: |
          echo "Available Docker images:"
          docker images

          echo "Checking acme-ims:ci..."
          docker image inspect acme-ims:ci

      - name: Start Docker container
        run: |
          docker run -d \
            --name acme-ims-test \
            -p 8080:8080 \
            acme-ims:ci

          docker ps

      - name: Test container health
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              echo
              echo "Container API is healthy"
              exit 0
            fi

            echo "Waiting for container API..."
            sleep 1
          done

          echo "Container API health check failed"
          docker logs acme-ims-test || true
          exit 1

      - name: Show container logs
        if: failure()
        run: |
          echo "------ CONTAINER LOG ------"
          docker logs acme-ims-test || true

      - name: Stop test container
        if: always()
        run: |
          docker rm -f acme-ims-test || true

      # --------------------------------------------------------
      # Trivy Docker Image Scan
      # --------------------------------------------------------
      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acme-ims:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          exit-code: "1"