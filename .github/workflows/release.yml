name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: acme-ims
  IMAGE_TAG: release
  PYTHON_VERSION: "3.12"

jobs:

  release:
    name: Build and Validate Release
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display repository structure
        run: |
          echo "Repository root:"
          pwd
          ls -la

          echo "Dockerfiles:"
          find . -maxdepth 3 -type f -name Dockerfile -print


      # =====================================================
      # 2. VERIFY REQUIRED FILES
      # =====================================================
      - name: Verify release files
        run: |
          if [ ! -f app/Dockerfile ]; then
            echo "ERROR: app/Dockerfile not found"
            exit 1
          fi

          if [ ! -f app/main.py ]; then
            echo "ERROR: app/main.py not found"
            exit 1
          fi

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          echo "Required release files found"


      # =====================================================
      # 3. DOCKER BUILDX
      # =====================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Display Docker information
        run: |
          docker --version
          docker buildx version


      # =====================================================
      # 4. BUILD RELEASE IMAGE
      #
      # IMPORTANT:
      # Context MUST be repository root "."
      #
      # Dockerfile uses:
      # COPY requirements.txt ...
      # COPY app/ ...
      # =====================================================
      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/Dockerfile
          pull: true
          no-cache: true
          push: false
          load: true
          tags: |
            acme-ims:release
            acme-ims:${{ github.sha }}


      # =====================================================
      # 5. VERIFY IMAGE
      # =====================================================
      - name: Verify release image
        run: |
          docker image inspect acme-ims:release > /dev/null

          echo "Release image successfully created"

          docker images


      # =====================================================
      # 6. VERIFY PATCHED PYTHON PACKAGES
      # =====================================================
      - name: Verify Python package versions
        run: |
          docker run --rm \
            acme-ims:release \
            python -c "import importlib.metadata as m; \
            print('msgpack:', m.version('msgpack')); \
            print('setuptools:', m.version('setuptools')); \
            print('urllib3:', m.version('urllib3'))"


      # =====================================================
      # 7. START RELEASE CONTAINER
      # =====================================================
      - name: Start release container
        run: |
          docker run \
            --detach \
            --name acme-ims-release \
            --publish 8080:8080 \
            acme-ims:release


      # =====================================================
      # 8. HEALTH CHECK
      # =====================================================
      - name: Wait for API health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8080/health; then

              echo
              echo "Release API health check PASSED"
              exit 0
            fi

            echo "Waiting for API: attempt ${attempt}/30"

            sleep 2
          done

          echo "ERROR: API failed to become healthy"

          docker logs acme-ims-release

          exit 1


      # =====================================================
      # 9. API VALIDATION
      # =====================================================
      - name: Validate root endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/

          echo
          echo "Root endpoint PASSED"

      - name: Validate health endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/health

          echo
          echo "Health endpoint PASSED"

      - name: Validate OpenAPI endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/openapi.json \
            > /dev/null

          echo "OpenAPI endpoint PASSED"


      # =====================================================
      # 10. CONTAINER LOGS
      # =====================================================
      - name: Display release container logs
        if: always()
        run: |
          docker logs acme-ims-release || true


      # =====================================================
      # 11. CLEAN UP TEST CONTAINER
      # =====================================================
      - name: Stop release validation container
        if: always()
        run: |
          docker rm --force acme-ims-release || true


      # =====================================================
      # 12. TRIVY SECURITY SCAN
      # =====================================================
      - name: Run Trivy release image scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

        with:
          version: "v0.74.0"

          scan-type: "image"

          image-ref: "acme-ims:release"

          scanners: "vuln"

          vuln-type: "os,library"

          format: "table"

          severity: "HIGH,CRITICAL"

          ignore-unfixed: true

          exit-code: "1"

          skip-files: "**/pip/_vendor/bom.cdx.json"


      # =====================================================
      # 13. RELEASE SUMMARY
      # =====================================================
      - name: Release validation completed
        run: |
          echo "========================================="
          echo "RELEASE VALIDATION SUCCESSFUL"
          echo "========================================="
          echo "Environment      : ${{ inputs.environment }}"
          echo "Docker image     : acme-ims:release"
          echo "Commit image     : acme-ims:${{ github.sha }}"
          echo "Docker build     : PASSED"
          echo "Container health : PASSED"
          echo "Root endpoint    : PASSED"
          echo "Health endpoint  : PASSED"
          echo "OpenAPI endpoint : PASSED"
          echo "Trivy scan       : PASSED"
          echo "========================================="